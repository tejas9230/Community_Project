<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Duplicate Complaint Detected</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Segoe UI;
        }

        .card{

            width:700px;
            border:none;
            border-radius:20px;
            background:white;
            box-shadow:0px 10px 30px rgba(0,0,0,.25);
        }

        .warning{

            font-size:70px;
        }

        .complaint{

            background:#f8f9fa;
            border-left:5px solid orange;
            padding:15px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="card p-5">

    <div class="text-center">

        <div class="warning">⚠</div>

        <h2 class="text-danger">

            Possible Duplicate Complaint

        </h2>

        <p class="text-muted">

            We found a complaint that looks very similar.

        </p>

    </div>

    <hr>

    <h5>Similarity</h5>

    <div class="progress mb-4">

        <div
            class="progress-bar bg-warning"
            style="width: {{ similarity }}%;">

            {{ similarity }}%

        </div>

    </div>

    <h5>Existing Complaint</h5>

    <div class="complaint">

        {{ matched_complaint }}

    </div>

    <br>

    <div class="alert alert-warning">

        Submitting another complaint may create duplicate work for officers.

    </div>

    <div class="d-flex justify-content-between">

        <a href="/submit_complaint"
           class="btn btn-secondary">

            Cancel

        </a>

        <form action="/submit_anyway" method="POST">

    <button class="btn btn-danger">

        Submit Anyway

    </button>

</form>

    </div>

</div>

</body>

</html>
